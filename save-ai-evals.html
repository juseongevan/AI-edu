const log = document.getElementById('log')
function print(msg, cls) {
  const span = document.createElement('span')
  span.className = cls || ''
  span.textContent = msg + '\n'
  log.appendChild(span)
}

async function run() {
  log.innerHTML = ''
  print('저장 시작...\n')
  let ok = 0, fail = 0
  for (const [id, text] of Object.entries(evaluations)) {
    try {
      const url = `${BASE}/${id}?key=${API_KEY}&updateMask.fieldPaths=aiMemo`
      const res = await fetch(url, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { aiMemo: { stringValue: text } } })
      })
      if (!res.ok) throw new Error(`HTTP ${res.status}`)
      print(`✅ 저장 완료: ${id}`, 'ok')
      ok++
    } catch (e) {
      print(`❌ 실패: ${id} — ${e.message}`, 'err')
      fail++
    }
  }
  print(`\n완료! 성공 ${ok}건 / 실패 ${fail}건`)
}
